<!DOCTYPE html>
<html>
<head>
    <title>Pricing Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 class="title">Pricing Plans</h2>

<div class="card-container">

    <!-- Basic -->
    <div class="card">
        <h3>Basic</h3>
        <h2>$9/month</h2>
        <ul>
            <li>Single User</li>
            <li>5GB Storage</li>
            <li>Email Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <!-- Standard -->
    <div class="card">
        <h3>Standard</h3>
        <h2>$19/month</h2>
        <ul>
            <li>Up to 5 Users</li>
            <li>50GB Storage</li>
            <li>Priority Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <!-- Premium -->
    <div class="card">
        <h3>Premium</h3>
        <h2>$29/month</h2>
        <ul>
            <li>Unlimited Users</li>
            <li>200GB Storage</li>
            <li>24/7 Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

</div>

</body>
</html>
