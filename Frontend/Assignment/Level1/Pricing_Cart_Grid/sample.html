<!DOCTYPE html>
<html>
<head>
    <title>Pricing Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 class="title">Pricing Plans</h2>

<div class="card-container">

  
    <div class="card">
        <h3>Free</h3>
        <h2>$0/mo</h2>
        <ul>
            <li>Single User</li>
            <li>5GB Storage</li>
            <li>Email Support </li>
        </ul>
        <button>Choose Plan</button>
    </div>

   
    <div class="card">
        <h3>Pro</h3>
        <h2>$19/mo</h2>
        <ul>
            <li>Up to 5 Users</li>
            <li>50GB Storage</li>
            <li>Priority Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

   
    <div class="card">
        <h3>Enterprise</h3>
        <h2>$29/mo</h2>
        <ul>
            <li>Unlimited Users</li>
            <li>200GB Storage</li>
            <li>24/7 Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

</div>

</body>
</html>
