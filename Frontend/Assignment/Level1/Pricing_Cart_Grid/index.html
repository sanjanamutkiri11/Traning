<!DOCTYPE html>
<html>
<head>
    <title>Pricing Card Grid</title>
</head>

<body>

<h2 align="center">Pricing Plans</h2>

<table align="center" border="0" cellpadding="20">
    <tr>

      
        <td>
            <div>
                <h3 align="center">Basic</h3>
                <h2 align="center">$9/month</h2>
                <ul>
                    <li>Single User</li>
                    <li>5GB Storage</li>
                    <li>Email Support</li>
                </ul>
                <p align="center">
                    <button>Choose Plan</button>
                </p>
            </div>
        </td>

        <!-- Standard Plan -->
        <td>
            <div>
                <h3 align="center">Standard</h3>
                <h2 align="center">$19/month</h2>
                <ul>
                    <li>Up to 5 Users</li>
                    <li>50GB Storage</li>
                    <li>Priority Support</li>
                </ul>
                <p align="center">
                    <button>Choose Plan</button>
                </p>
            </div>
        </td>

        <!-- Premium Plan -->
        <td>
            <div>
                <h3 align="center">Premium</h3>
                <h2 align="center">$29/month</h2>
                <ul>
                    <li>Unlimited Users</li>
                    <li>200GB Storage</li>
                    <li>24/7 Support</li>
                </ul>
                <p align="center">
                    <button>Choose Plan</button>
                </p>
            </div>
        </td>

    </tr>
</table>

</body>
</html>
