<!DOCTYPE html>
<html>
<head>
    <title>Secure Document Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    
        /* Outer big box */
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 600px;          /* wider */
            min-height: 420px;     /* taller */
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            box-sizing: border-box;
        }
    
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 1px;
        }
    
        label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            display: block;
        }
    
        /* make all form elements same size */
        input, button {
            width: 100%;
            height: 46px;          /* same height */
            font-size: 15px;
            box-sizing: border-box;
            border-radius: 8px;
        }
    
        input {
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            outline: none;
        }
    
        input:focus {
            border-color: #0066ff;
            box-shadow: 0 0 0 2px rgba(0,102,255,0.15);
        }
    
        button {
            margin-top: 5px;
            border: none;
            background: linear-gradient(90deg, #0066ff, #0099ff);
            color: white;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: .5px;
        }
    
        button:hover {
            opacity: .9;
            transform: scale(1.01);
        }
    
        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }
    
        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 14px;
        }
    
        th {
            background: #f3f6ff;
        }
    
        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
    
        .hidden {
            display: none;
        }
    
        /* space between sections */
        #usernameSection,
        #docSection {
            margin-bottom: 10px;
        }
    </style>
    
</head>
<body>

<div class="card">

    <h2>Document Access System</h2>

    <!-- STEP 1 Username -->
    <div id="usernameSection">
        <label>Enter Username</label>
        <input type="text" id="username">
        <button onclick="submitUsername()">Continue</button>
    </div>

    <!-- STEP 2 Doc ID for non-admin -->
    <div id="docSection" class="hidden">
        <label>Enter Document ID</label>
        <input type="number" id="docid">
        <button onclick="fetchDoc()">Fetch Document</button>
    </div>

    <p id="message" class="error hidden"></p>

    <table id="resultTable" class="hidden">
        <thead>
            <tr>
                <th>ID</th>
                <th>Owner</th>
                <th>Content</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

</div>
<script>
    const BACKEND = "http://localhost:8080/api/document";
    window.onload = () => {
    document.getElementById("username").value = "";
    document.getElementById("docid").value = "";
    clearUI();
};

    function submitUsername(){
        const username = document.getElementById("username").value.trim();
    
        if(username === ""){
            alert("Please enter username");
            return;
        }
    
        // hide username section (removes Continue button too)
        document.getElementById("usernameSection").classList.add("hidden");
    
        // If admin → fetch all documents immediately
        if(username === "admin"){
            fetchAdminData();
        } 
        else {
            // Show doc id section for normal user
            document.getElementById("docSection").classList.remove("hidden");
        }
    }
    
    function fetchAdminData(){
        const url = BACKEND + "?username=admin";
    
        fetch(url)
          .then(res => res.json())
          .then(data => displayTable(data))
          .catch(err => showError(err.message));
    }
    
    function fetchDoc(){
        const username = document.getElementById("username").value;
        const docid = document.getElementById("docid").value;
    
        const url = BACKEND + "?username=" + username + "&docid=" + docid;
    
        fetch(url)
          .then(async res => {
            if(!res.ok){
                const text = await res.text();
                throw new Error(text);
            }
            return res.json();
          })
          .then(data => displayTable(data))
          .catch(err => showError(err.message));
    }
    
    function displayTable(data){
        document.getElementById("message").classList.add("hidden");
        document.getElementById("resultTable").classList.remove("hidden");
    
        const body = document.getElementById("tableBody");
        body.innerHTML = "";
    
        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.id}</td>
                <td>${row.owner}</td>
                <td>${row.content}</td>
            `;
            body.appendChild(tr);
        });
    }
    
    function showError(msg){
        const el = document.getElementById("message");
        el.textContent = msg;
        el.classList.remove("hidden");
    }
    </script>
    

</body>
</html>
